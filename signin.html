<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>BorrowBox - Sign In</title>
<script src="js/theme-init.js"></script>
<script src="js/auth.js?v=4"></script>
<script src="js/shared.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#3b82f6",
        "background-light": "#f6f6f8",
        "background-dark": "#0c0c0c",
      },
      fontFamily: {
        display: ["Inter", "sans-serif"]
      },
      borderRadius: {
        DEFAULT: "0.25rem",
        lg: "0.5rem",
        xl: "0.75rem",
        full: "9999px"
      },
    },
  },
}
</script>
<style>
body { font-family: 'Inter', sans-serif; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

/* Dark mode global polish */
.dark body { background-color: #0c0c0c; }
.dark .border-slate-200 { border-color: rgba(71, 85, 105, 0.4) !important; }
.dark table { border-color: transparent; }
.dark thead tr { border-bottom-color: rgba(71, 85, 105, 0.3) !important; }
.dark tbody tr { border-bottom-color: rgba(71, 85, 105, 0.2) !important; }
.dark .divide-y > * + * { border-top-color: rgba(71, 85, 105, 0.2) !important; }

/* Glowing card effect in dark mode */
.dark .shadow-lg {
  box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) !important;
}
.dark .shadow-md {
  box-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) !important;
}
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased transition-colors duration-200 flex items-center justify-center min-h-screen">
    
    <div class="w-full max-w-md p-8 bg-white dark:bg-slate-900 rounded-3xl shadow-lg shadow-black/5 dark:shadow-[0_8px_32px_rgba(0,0,0,0.7)] border border-slate-200 dark:border-slate-800 relative overflow-hidden">
        
        <!-- Decorative subtle element -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-primary/10 rounded-full blur-3xl"></div>

        <div class="relative z-10">
            <div class="flex items-center gap-2 text-primary justify-center mb-2">
                <span class="material-symbols-outlined text-4xl font-bold">package_2</span>
            </div>
            <h2 class="text-2xl font-black tracking-tight text-center mb-1">Sign in to BorrowBox</h2>
            <p class="text-sm text-slate-500 text-center mb-8">Enter your credentials to access the system</p>
            
            <form id="signinForm" class="space-y-5">
                <div id="loginMessage" class="hidden rounded-xl px-4 py-3 text-sm text-center"></div>
                
                <div>
                    <label class="block text-sm font-semibold mb-2">Username</label>
                    <input type="text" id="username" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950/50 px-4 py-3 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-slate-400" placeholder="e.g. admin" />
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-2">Password</label>
                    <input type="password" id="password" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950/50 px-4 py-3 text-sm outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-slate-400" placeholder="••••••••" />
                </div>
                
                <button type="submit" id="loginBtn" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2 mt-4">
                    <span>Sign In</span>
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
                </button>
            </form>

        </div>
    </div>

    <!-- Theme Toggle positioned absolute -->
    <div class="absolute top-6 right-6">
        <button id="themeToggle" class="flex h-10 w-10 items-center justify-center rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm" type="button">
            <span id="themeIcon" class="material-symbols-outlined text-slate-600 dark:text-slate-300">dark_mode</span>
        </button>
    </div>

    <script src="js/signin.js"></script>
</body>
</html>
